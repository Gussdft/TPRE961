---
# role k3s_server — Installe le control-plane K3s.
# Traefik (Ingress) et ServiceLB sont intégrés à K3s : pas de MetalLB ni ingress-nginx.

- name: Installer le control-plane K3s
  ansible.builtin.shell:
    cmd: >
      curl -sfL https://get.k3s.io |
      INSTALL_K3S_VERSION="{{ k3s_version }}"
      K3S_TOKEN="{{ k3s_token }}"
      sh -s - server
      --write-kubeconfig-mode 644
      --node-ip {{ ansible_host }}
      --advertise-address {{ ansible_host }}
      --tls-san {{ ansible_host }}
    creates: /usr/local/bin/k3s

- name: Attendre que l'API K3s réponde
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Attendre que le nœud control-plane soit Ready
  ansible.builtin.shell: >
    k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: cp_ready
  until: cp_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Créer le dossier kube de l'utilisateur ubuntu
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copier le kubeconfig pour l'utilisateur ubuntu
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"
