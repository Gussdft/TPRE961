---
# role nfs_server — Serveur NFS co-localisé sur le control-plane.
# Sert de backend de stockage au nfs-subdir-external-provisioner (StorageClass nfs-client).

- name: Installer le serveur NFS
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true

- name: Créer le répertoire d'export NFS
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0777"

- name: Configurer /etc/exports
  ansible.builtin.copy:
    dest: /etc/exports
    content: "{{ nfs_export_path }} *(rw,sync,no_subtree_check,no_root_squash)\n"
    mode: "0644"
  notify: Recharger les exports NFS

- name: Activer et démarrer nfs-kernel-server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    enabled: true
    state: started
